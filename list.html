<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMFIT 쇼핑몰 - 취업용 포트폴리오</title>
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">

    <!-- head 태그에 들어갈 seo(검색최적화) 코드 -->
    <meta name="description"
        content="HOMFIT은 1인 가구의 라이프스타일에 맞춘 가구와 홈·리빙 제품을 제안합니다. 거실, 침실, 주방, 패브릭부터 감각적인 데코 아이템까지 나에게 꼭 맞는 공간을 완성해보세요.">
    <meta name="keywords" content="HOMFIT, 홈핏, 가구 쇼핑몰, 홈리빙, 1인 가구, 인테리어, 리빙, 가구, 소파, 테이블, 침실가구, 주방용품, 패브릭, 홈데코">
    <meta name="author" content="HOMFIT">
    <meta name="robots" content="index, follow">
    <!-- 대표 URL -->
    <link rel="canonical" href="https://www.도메인주소(나중에 도메인 사서 수정).com/">
    <!-- Open Graph : 카카오톡, 네이버, 페이스북 등 공유 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="HOMFIT">
    <meta property="og:title" content="HOMFIT | 나에게 꼭 맞는 따뜻한 홈·리빙">
    <meta property="og:description" content="실용적이면서도 따뜻한 공간을 위한 홈·리빙 브랜드 HOMFIT. 나의 생활과 공간에 꼭 맞는 가구와 리빙 아이템을 만나보세요.">
    <meta property="og:url" content="https://www.도메인주소.com">
    <meta property="og:image" content="https://www.도메인주소.com/img/hero-pc.jpg">
    <meta property="og:locale" content="ko_KR">
    <link rel="icon" type="image/png" href="./img/favicon.png">



    <link rel="stylesheet" href="./css/list.css">
    <script src="./js/header.js" defer></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="./js/new-product.js" defer></script>
    <script src="./js/product-control-new.js" defer></script>

       <!-- 공통 header / footer 파일 연결 -->
     <script src="./js/include.js" defer></script>

</head>

<body>

    <div id="header-wrap">
        <!-- header.html 파일에 내용이 들어오는 영역 -->
    </div>




    <main>

        <div class="hero-banner">
            <a href="#">
                <picture>
                    <source media="(max-width:768px)" srcset="./img/new-01-mo.png">
                    <source media="(max-width:1024px)" srcset="./img/new-01-pad.png">
                    <img src="./img/new-01-pc.png" alt="HF 쇼핑몰 신상품 배너 이미지">
                </picture>
            </a>
        </div>

        <section class="con1">
            <div class="common-frame">
                <div class="title">
                    <h1>NEW MOOD, NEW HOME</h1>
                    <span></span>
                    <p>당신의 일상에 스며드는 편안함</p>
                </div>

                <ul class="new-product grid-list">
                    <li>
                        <a href="#">
                            <figure>
                                <img src="./img/N1.jpg" alt="코지 부클레 1인 라운지 체어">
                            </figure>
                            <div class="sale-txt">
                                <h4 class="title-1">코지 부클레 1인 라운지 체어</h4>
                                <p class="desc-1">포근한 부클레 원단과 아늑한 라운드 디자인으로 완벽한 휴식을 선사합니다</p>
                                <div class="pay-frame">
                                    <div class="pay-original">
                                        <span>280,000</span>원
                                    </div>
                                    <div class="pay-discount">
                                        <div class="discount">10%</div>
                                        <div class="pay"><b>530,100</b>원</div>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </li>
                </ul>


            </div>
        </section>


    </main>




<div id='footer-wrap'>
    <!-- footer.html 파일의 내용이 들어오는 영역 -->
</div>



</body>

</html>
